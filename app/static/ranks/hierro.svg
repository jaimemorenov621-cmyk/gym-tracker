<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Rango hierro"><style>.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box}@keyframes tw{0%,100%{opacity:.15;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}.shine{animation:sh 3.6s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-150px)}55%,100%{transform:translateX(150px)}}.rays{animation:rot 18s linear infinite;transform-origin:100px 100px}@keyframes rot{to{transform:rotate(360deg)}}.aura{animation:pulse 2.8s ease-in-out infinite;transform-origin:100px 100px}@keyframes pulse{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}@media (prefers-reduced-motion:reduce){.tw,.shine,.rays,.aura{animation:none}}</style><defs><linearGradient id="hierro_rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6dae0"/><stop offset="0.5" stop-color="#9aa1ab"/><stop offset="1" stop-color="#4a4f57"/></linearGradient><linearGradient id="hierro_field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa1ab"/><stop offset="1" stop-color="#4f555e"/></linearGradient><linearGradient id="hierro_wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6dae0"/><stop offset="1" stop-color="#4f555e"/></linearGradient><clipPath id="hierro_clip"><path d="M100 40 L137 53 V92 C137 123 120 142 100 152 C80 142 63 123 63 92 V53 Z"/></clipPath><linearGradient id="hierro_shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="hierro_gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#9aa1ab"/><stop offset="1" stop-color="#4a4f57"/></linearGradient><linearGradient id="hierro_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6cc"/><stop offset="1" stop-color="#d49a0a"/></linearGradient></defs><path d="M100 30 L146 46 V92 C146 130 126 152 100 164 C74 152 54 130 54 92 V46 Z" transform="translate(0 4)" fill="#000" opacity="0.22"/><path d="M100 30 L146 46 V92 C146 130 126 152 100 164 C74 152 54 130 54 92 V46 Z" fill="url(#hierro_rim)" stroke="#4a4f57" stroke-width="3" stroke-linejoin="round"/><path d="M100 40 L137 53 V92 C137 123 120 142 100 152 C80 142 63 123 63 92 V53 Z" fill="url(#hierro_field)" stroke="#d6dae0" stroke-width="2" stroke-opacity="0.7"/><g clip-path="url(#hierro_clip)"><path d="M60 40 L140 40 L140 74 C120 66 80 66 60 78 Z" fill="#fff" opacity="0.22"/></g><path d="M78 98 H122" stroke="#4a4f57" stroke-width="12" stroke-linecap="round" opacity="0.35" transform="translate(0 2)"/><path d="M78 98 H122" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/></svg>