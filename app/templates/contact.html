{% extends "base.html" %}
{% block content %}
    <p class="page-back"><a href="{{ url_for('settings') }}">{{ _("← Configuración") }}</a></p>
    <h1 class="page-title">{{ _("Contacto") }}</h1>
    <form method="post" class="card card-elevated contact-form form-ui">
        {{ form.hidden_tag() }}
        <label for="body">{{ _("Dudas, errores, ideas o peticiones sobre tus datos:") }}</label>
        <textarea id="body" name="body" rows="7" maxlength="{{ max_chars }}" required>{{ body }}</textarea>
        <p class="std-note">{{ _("Te responderemos al email de tu cuenta: %(email)s", email=current_user.email) }}</p>
        <button type="submit" class="btn">{{ _("Enviar") }}</button>
    </form>
{% endblock %}
